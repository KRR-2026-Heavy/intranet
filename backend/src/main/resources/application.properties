spring.config.import=optional:file:./.env[.properties]
server.port=${PORT:8080}
logging.level.org.springframework.web=INFO
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=22MB
krr.organization-chart.storage-directory=${KRR_ORGANIZATION_CHART_STORAGE_DIRECTORY:${user.home}/.krr-intranet/organization-charts}
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${KRR_SESSION_COOKIE_SAME_SITE:strict}
server.servlet.session.cookie.secure=${KRR_SESSION_COOKIE_SECURE:false}
krr.cors.allowed-origin-patterns=${KRR_CORS_ALLOWED_ORIGIN_PATTERNS:https://intranet-ezpy.vercel.app,http://localhost:[*],http://127.0.0.1:[*],http://192.168.26.96:[*]}
krr.session.cookie.same-site=${KRR_SESSION_COOKIE_SAME_SITE:strict}
krr.session.cookie.secure=${KRR_SESSION_COOKIE_SECURE:false}
